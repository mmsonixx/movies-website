<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../dist/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <title>Movie</title>
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <div class="search">
          <form class="search-form">
            <label>
              <input
                id="search-movie"
                type="search"
                placeholder="Search"
                data-search
              />
              <div class="search_icon">
                <i class="fa-solid
                fa-magnifying-glass"></i>
              </div>
            </label>
          </form>
        </div>
       <div class="ganre" data-filter>

  <div class="select">
    <button class="selected" type="button">
      <span class="selected-text">Choose a genre</span>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512"
        class="arrow"
      >
        <path
          d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"
        />
      </svg>
    </button>

    <div class="options">

      <button class="option" data-ganre="all" type="button">
        All genres
      </button>

      <button class="option" data-ganre="drama" type="button">
       Drama
      </button>

      <button class="option" data-ganre="crime" type="button">
        Crime
      </button>

      <button class="option" data-ganre="mystery" type="button">
       Mysticа
      </button>

      <button class="option" data-ganre="biography" type="button">
       Biographical
      </button>

      <button class="option" data-ganre="western" type="button">
       Western
      </button>

      <button class="option" data-ganre="comedy" type="button">
        Comedy
      </button>

      <button class="option" data-ganre="family" type="button">
        Family
      </button>

      <button class="option" data-ganre="animation" type="button">
      Animated
      </button>

      <button class="option" data-ganre="romance" type="button">
        Romantic
      </button>

      <button class="option" data-ganre="music" type="button">
    Musicals
      </button>

      <button class="option" data-ganre="adventure" type="button">
       Adventures
      </button>

      <button class="option" data-ganre="thriller" type="button">
       Thriller
      </button>

      <button class="option" data-ganre="sci-fi" type="button">
      Sci-fi
      </button>

      <button class="option" data-ganre="action" type="button">
       Action
      </button>

    </div>
  </div>
</div>
       <div class="sort">
  <div class="sort-select">

    <button class="sort-selected" type="button">
      <span class="sort-selected-text">Sort by</span>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512"
        class="sort-arrow"
      >
        <path
          d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"
        />
      </svg>
    </button>

    <div class="sort-options">

      <button
        class="sort-option"
        type="button"
        data-sort="year"
      >
        Year
      </button>

      <button
        class="sort-option"
        type="button"
        data-sort="rating"
      >
        Rating
      </button>

    </div>

  </div>
  
</div>
<div class="switch">
  <label class="theme-switch">
  <input type="checkbox" id="theme-toggle">
  <span class="slider">
    <span class="moon-switch"><i class="fa-solid fa-moon"></i></span>
    <span class="sun-switch"><i class="fa-solid fa-sun"></i></span>
  </span>
</label>
</div>

<div class="clock">
  <p class="clock-time" data-clock>00:00:00</p>
</div>
    </header>
    
    <div class="uiverse-midnight-sky">
      <div class="sky-canvas">
        <div class="stars stars-1"></div>
        <div class="stars stars-2"></div>
        <div class="stars stars-3"></div>

        <div class="meteor m1"></div>
        <div class="meteor m2"></div>
        <div class="meteor m3"></div>

        <div class="moon"></div>
      </div>
    </div>
<div class="container">
    <dіv class="movie" data-movies> </dіv>
    </div>
   <div class="trailer-modal" data-modal>
  <div class="trailer-modal__overlay" data-close-modal></div>

  <div class="trailer-modal__content">
    <button
      class="trailer-modal__close"
      type="button"
      data-close-modal
    >
      ×
    </button>

    <video
      class="trailer-video"
      data-video
      controls
      playsinline
        preload="metadata"
    ></video>
  </div>
</div>

<div class="form">
  <div class='container form_container'>

  <form id="user-form">
  <label>
    Name:
    <input type="text" id="name" placeholder="Enter your name" />
  </label>

  <label>
    Email:
    <input type="email" id="email" placeholder="Enter your email" />
  </label>

  <label>
    Age:
    <input type="number" id="age" placeholder="Enter your age" />
  </label>

  <button type="submit">Save</button>
</form>
 </div>
</div>
